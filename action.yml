name: "Mainfast Migrations"
description: "Fails a PR whose database migrations would fork the migration history once merged into main (Alembic, Django, Prisma, Rails, Flyway, Drizzle), and re-checks open PRs with a blocking commit status when main moves."
author: "Mainfast authors"
branding:
  icon: "database"
  color: "blue"
inputs:
  mode:
    description: "auto (check on pull_request, recheck-open-prs on push), check, or recheck-open-prs"
    default: auto
  token:
    description: Token for comments, labels and statuses. The workflow GITHUB_TOKEN is enough.
    default: ${{ github.token }}
  main-branch:
    description: Branch PRs merge into. Defaults to the repository default branch.
    default: ""
  config:
    description: Path to a config file in the checkout, used instead of .mainfast.yml on the main branch.
    default: ""
  comment:
    description: Post one PR comment, updated in place, when the PR's migrations conflict with main.
    default: "true"
  comment-author:
    description: "Login the token posts comments as. Only a Mainfast comment written by this login is ever updated, so a copied marker in someone else's comment is ignored. Default: the token's own user when it can read GET /user, else github-actions[bot]. Set <app-slug>[bot] for a GitHub App installation token."
    default: ""
  label:
    description: 'Label for stale PRs. Defaults to migrations.label in .mainfast.yml, else "mainfast: migrations stale".'
    default: ""
  status:
    description: "Set the mainfast/migrations commit status on each PR head: failure when the PR's migrations conflict with main, success when clean. Only this status blocks a merge, once branch protection requires it. Needs statuses: write. false turns it off."
    default: "true"
  fail-on:
    description: "error, warning or never: lowest finding level that fails the step (check mode)"
    default: error
  max-prs:
    description: Most open PRs to re-check per push to main.
    default: "50"
  license:
    description: "Your Mainfast license key (Pro, or the optional free key), from the MAINFAST_LICENSE secret. Optional: no feature needs it, and public repositories and private ones with up to 5 active contributors never need it. Checked once per run with Polar (only the key and the organization id are sent; if Polar cannot be reached, the key counts as valid). Without a Pro key, a larger private repository gets one notice in the job summary; the result never changes."
    default: ""
outputs:
  ok:
    description: "true when the merge keeps every migration history consistent (check mode)"
  report:
    description: Full report as JSON
  stale-prs:
    description: Comma-separated PR numbers found stale (recheck mode)
runs:
  using: node24
  main: "dist/index.cjs"
